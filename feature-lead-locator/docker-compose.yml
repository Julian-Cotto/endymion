services:
  db:
    # PostGIS (not plain postgres) — the scoring engine stores H3 cells, POI
    # geometries and tract polygons, and does distance/containment queries.
    image: postgis/postgis:16-3.4
    container_name: lead-locator-db
    environment:
      POSTGRES_DB: lead_locator
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
    ports:
      - "5435:5432"
    volumes:
      - lead_locator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads -d lead_locator"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lead_locator_pgdata:
