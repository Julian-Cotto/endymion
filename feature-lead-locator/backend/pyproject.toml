[project]
name = "lead_locator_service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "jsonschema>=4.22.0",
  "sqlalchemy",
  "psycopg2-binary",
  "alembic",
  # Geospatial: PostGIS column types, H3 tiling, geometry construction.
  "GeoAlchemy2",
  "h3>=4.0",
  "shapely",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27,<1.0",
  # Mocks httpx at the transport layer so source adapters are tested without
  # hitting Overpass/Census — those are rate-limited and flaky by nature, and
  # a test suite must not depend on them being up.
  "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-dir]
app = "app"